<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kavismovies · Find Your Next Movie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-left: #232323;
    --bg-right: #1b1b1b;
    --card: #2b2b2b;
    --card-edge: #3a3a3a;
    --text: #f2f2f2;
    --muted: #a6a6a6;
    --yellow: #f5c518;
    --blue: #3a86ff;
    --orange: #e8891c;
    --yes: #2f9e6b;
    --yes-hover: #36b47a;
    --no: #c2453d;
    --no-hover: #d65148;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Manrope", system-ui, -apple-system, sans-serif;
    color: var(--text);
    background: var(--bg-right);
    overflow-x: hidden;
  }

  /* Background photo */
  .backdrop {
    position: fixed; inset: 0; z-index: 0;
    background: #000 url("bg.jpg") center 70% / cover no-repeat;
  }
  .backdrop::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at center 45%, rgba(0,0,0,.15), rgba(0,0,0,.55) 75%);
  }

  .top-left {
    position: fixed; top: 14px; left: 28px; z-index: 5;
    display: flex; align-items: flex-start; gap: 18px;
  }
  .wheel-wrap { display: flex; flex-direction: column; align-items: center; }
  .wheel {
    background: none; border: none; padding: 0; cursor: pointer; line-height: 0;
    filter: drop-shadow(0 6px 16px rgba(0,0,0,.6));
    transition: transform .15s ease;
  }
  .wheel:hover { transform: scale(1.05); }
  .wheel:focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; border-radius: 50%; }
  .wheel-label { color: var(--blue); font-weight: 800; font-size: 15px; margin-top: 6px; text-align: center; line-height: 1.2; cursor: pointer; }
  .wheel-label:hover { color: #6aa5ff; }


  /* View all movies button */
  .all-btn {
    position: fixed; top: 22px; right: 32px; z-index: 5;
    display: inline-flex; align-items: center; gap: 8px;
    background: #000; color: var(--blue); font-family: inherit; font-weight: 800; font-size: 15px;
    padding: 8px 18px 8px 12px; border-radius: 999px; border: 1px solid rgba(58,134,255,.35);
    cursor: pointer; transition: border-color .15s ease, transform .15s ease;
  }
  .all-btn:hover { border-color: var(--blue); transform: translateY(-1px); }

  /* All movies page */
  .all-page {
    position: fixed; inset: 0; z-index: 2; overflow-y: auto;
    background: radial-gradient(ellipse at top, #161616 0%, #0a0a0a 70%);
    padding: 120px 40px 110px;
  }
  .all-head { max-width: 1200px; margin: 0 auto 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .all-head h1 { font-size: 26px; font-weight: 800; letter-spacing: -.015em; }
  .all-head h1 span { color: var(--muted); font-weight: 600; font-size: 18px; }
  .all-search {
    font-family: inherit; font-size: 15px; color: var(--text); background: #000;
    border: 1px solid rgba(58,134,255,.35); border-radius: 999px; padding: 10px 18px; width: min(320px, 100%);
  }
  .all-search:focus { outline: none; border-color: var(--blue); }
  .all-grid { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 22px 18px; }
  .all-empty { text-align: center; color: var(--muted); margin-top: 30px; }
  body.on-all .backdrop, body.on-all main, body.on-all .top-left, body.on-all .all-btn { display: none; }
  body.on-all header { background: linear-gradient(#0b0b0b 75%, rgba(11,11,11,0)); padding-bottom: 34px; }

  /* Random page */
  .random-page {
    position: fixed; inset: 0; z-index: 2;
    background: radial-gradient(ellipse at center, #161616 0%, #0a0a0a 70%);
    display: flex; align-items: center; justify-content: center;
  }
  .big-wheel-wrap { position: relative; width: min(72vh, 86vw); aspect-ratio: 1; }
  .wheel-pointer {
    position: absolute; top: 50%; left: 97.6%; width: 7%; height: 7%;
    transform: translateY(-50%); z-index: 1; filter: drop-shadow(0 4px 10px rgba(0,0,0,.6));
  }
  .big-wheel { width: 100%; height: 100%; filter: drop-shadow(0 30px 60px rgba(0,0,0,.7)); }
  .big-wheel text { font-family: "Manrope", system-ui, sans-serif; font-weight: 600; fill: rgba(255,255,255,.88); }
  .hub { cursor: pointer; }
  .hub:focus { outline: none; }
  .hub:hover circle { fill: #ffffff; }
  .big-wheel .click-here {
    fill: #e0262f; font-weight: 800; font-size: 3.3px; letter-spacing: .02em;
    animation: blink 1s steps(1, end) infinite;
  }
  .spinning .click-here { animation: none; opacity: 0; }
  .spinning .hub { cursor: default; }
  @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }

  .spin-result {
    position: fixed; inset: 0; z-index: 6; background: rgba(0,0,0,.72);
    display: flex; align-items: center; justify-content: center; padding: 24px;
    animation: fadeIn .35s ease;
  }
  .card.spin-card { background: #1c1c1c; backdrop-filter: none; animation: popIn .4s cubic-bezier(.2,.9,.3,1.2); max-height: 92vh; overflow-y: auto; }
  .landed { color: var(--blue); font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
  .cast { color: #cfcfcf; font-size: 15px; margin-bottom: 14px; }
  .cast b { color: var(--text); }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }

  .back-home {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 3;
    background: #000; color: var(--blue); font-family: inherit; font-weight: 800; font-size: 15px;
    padding: 10px 22px; border-radius: 999px; border: 1px solid rgba(58,134,255,.35); cursor: pointer;
  }
  .back-home:hover { border-color: var(--blue); }
  body:not(.on-random):not(.on-all) .my-picks { display: none; }
  body.on-random .backdrop, body.on-random main, body.on-random .top-left { display: none; }

  /* Header */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 3;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 22px 40px;
  }
  .brand {
    display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; letter-spacing: -.01em;
    background: #000; color: var(--blue); padding: 8px 22px; border-radius: 999px;
    border: 1px solid rgba(58,134,255,.35);
  }
  .badge {
    background: var(--blue); color: #000; font-weight: 800; font-size: 14px;
    padding: 4px 8px; border-radius: 5px; letter-spacing: .02em;
  }
  .header-note { color: var(--muted); font-size: 14px; font-weight: 500; }

  /* Center stage */
  main {
    position: relative; z-index: 2; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 120px 24px 40px;
  }
  .card {
    width: min(560px, 100%);
    background: rgba(28,28,28,.9);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 16px;
    padding: 40px 44px 36px;
    box-shadow: 0 30px 80px rgba(0,0,0,.45);
    text-align: center;
  }
  .progress-label {
    display: flex; justify-content: space-between;
    font-size: 13px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .08em;
  }

  .bar { height: 4px; background: #3d3d3d; border-radius: 4px; margin: 12px 0 36px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--yellow), var(--orange)); width: 8%; transition: width .4s ease; }

  .question {
    font-size: 28px; line-height: 1.3; font-weight: 700; letter-spacing: -.015em;
    min-height: 74px; margin-bottom: 10px;
    transition: opacity .2s ease;
  }
  .sub { color: var(--muted); font-size: 15px; margin-bottom: 34px; }

  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .btn {
    font-family: inherit; font-size: 16px; font-weight: 700; letter-spacing: .01em;
    color: #fff; border: none; border-radius: 10px; padding: 16px 0; cursor: pointer;
    transition: background .15s ease, transform .1s ease;
  }
  .btn:active { transform: scale(.98); }
  .btn-yes { background: var(--yes); }
  .btn-yes:hover { background: var(--yes-hover); }
  .btn-no { background: var(--no); }
  .btn-no:hover { background: var(--no-hover); }

  .back {
    margin-top: 22px; background: none; border: none; color: var(--muted);
    font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .back:hover { color: var(--text); }
  .back:disabled { opacity: .3; cursor: default; }

  [hidden] { display: none !important; }
  #quiz { transform: translateY(-60px); }
  @media (max-height: 640px) { #quiz { transform: none; } }
  .quiz-q { margin-bottom: 34px; display: flex; align-items: center; justify-content: center; }

  .my-picks { color: var(--blue); font-weight: 800; font-size: 15px; margin-top: 10px; white-space: nowrap; }

  /* Results */
  .card.wide { width: min(1040px, 100%); padding: 36px 36px 32px; }
  .results-head { margin-bottom: 26px; }
  .results-head h1 { font-size: 26px; font-weight: 800; letter-spacing: -.015em; }
  .results-head p { color: var(--muted); font-size: 15px; margin-top: 6px; }
  .posters { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; margin-bottom: 30px; }
  .pick {
    background: none; border: none; cursor: pointer; text-align: left; color: var(--text);
    font-family: inherit; transition: transform .2s ease;
    display: flex; flex-direction: column; align-self: start;
  }
  .pick:hover { transform: translateY(-4px); }
  .pick:hover .poster { box-shadow: 0 0 0 2px var(--yellow), 0 18px 40px rgba(0,0,0,.5); }
  .poster {
    aspect-ratio: 2 / 3; width: 100%; border-radius: 10px; overflow: hidden;
    background: linear-gradient(160deg, #3a3a3a, #262626);
    box-shadow: 0 12px 30px rgba(0,0,0,.4); transition: box-shadow .2s ease;
    display: flex; align-items: flex-end; position: relative;
  }
  .poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .poster .ph {
    padding: 14px; font-weight: 800; font-size: 15px; line-height: 1.25; color: #d8d8d8;
    border-top: 3px solid var(--yellow); width: 100%; min-height: 3px; background: rgba(0,0,0,.25);
  }
  .poster .ph:empty { padding: 0; }
  .pick-title { font-weight: 700; font-size: 14px; line-height: 1.3; margin-top: 12px; }
  .pick-year { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .actions { display: flex; justify-content: center; gap: 12px; }
  .actions .btn { padding: 14px 26px; }
  .btn-ghost { background: #3a3a3a; }
  .btn-ghost:hover { background: #474747; }
  .btn-start { background: var(--yellow); color: #111; }
  .btn-start:hover { background: #ffd43b; }

  /* This-or-that round */
  .card.vs-card { width: min(640px, 100%); text-align: center; }
  #vs { transform: translateY(-40px); }
  .vs-title { font-size: 26px; font-weight: 700; letter-spacing: -.015em; margin-bottom: 26px; }
  .vs-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 22px; margin-bottom: 6px; }
  .vs-pick {
    background: none; border: none; cursor: pointer; color: var(--text); font-family: inherit;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    transition: transform .2s ease;
  }
  .vs-pick .poster { width: 100%; max-width: 210px; }
  .vs-pick:hover { transform: translateY(-4px); }
  .vs-pick:hover .poster { box-shadow: 0 0 0 3px var(--blue), 0 18px 40px rgba(0,0,0,.5); }
  .vs-pick .pick-title { font-size: 16px; margin-top: 14px; }
  .vs-pick .pick-year { font-size: 14px; }
  .vs-pick .ph { color: #d8d8d8; font-weight: 800; font-size: 15px; line-height: 1.25; }
  .vs-word { font-size: 30px; font-weight: 800; color: var(--blue); font-style: italic; }

  /* Detail */
  .detail { display: grid; grid-template-columns: 240px 1fr; gap: 32px; text-align: left; align-items: start; }
  .detail .poster { cursor: default; }
  .detail h1 { font-size: 30px; font-weight: 800; letter-spacing: -.015em; line-height: 1.2; }
  .meta { display: flex; align-items: center; gap: 14px; margin: 10px 0 18px; color: var(--muted); font-size: 15px; flex-wrap: wrap; }
  .rating { display: inline-flex; align-items: center; gap: 8px; color: var(--text); font-weight: 700; }
  .rating .imdb { background: var(--yellow); color: #111; font-weight: 800; font-size: 12px; padding: 3px 6px; border-radius: 4px; }
  .plot { font-size: 16px; line-height: 1.6; color: #dcdcdc; margin-bottom: 26px; }
  .detail .actions { justify-content: flex-start; flex-wrap: wrap; }
  a.btn { text-decoration: none; display: inline-block; }

  @media (max-width: 700px) {
    header { padding: 18px 20px; }
    .top-left { left: 12px; top: 10px; gap: 10px; }
    .all-btn { top: 14px; right: 12px; font-size: 13px; padding: 7px 12px 7px 9px; }
    .all-page { padding: 150px 16px 100px; }
    .all-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 16px 12px; }
    .wheel svg { width: 64px; height: 64px; }
    .header-note { display: none; }
    .card { padding: 32px 24px 28px; }
    .question { font-size: 23px; }
    .card.wide { padding: 28px 20px; }
    .posters { grid-template-columns: repeat(2, 1fr); }
    .detail { grid-template-columns: 1fr; }
    .vs-row { gap: 10px; }
    .vs-title { font-size: 21px; }
    .vs-word { font-size: 22px; }
    .detail .poster { max-width: 220px; }
  }
</style>
</head>
<body>
  <div class="backdrop"></div>

  <div class="top-left">
    <div class="wheel-wrap">
      <button class="wheel" id="wheel" aria-label="Spin the wheel">
        <svg viewBox="0 0 100 100" width="104" height="104">
          <g id="wheel-spin" style="transform-origin:50px 52px">
            <g transform="translate(0 2)">
              <path d="M50 50 L50.00 10.00 A40 40 0 0 1 78.28 21.72 Z" fill="#3a86ff" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/><path d="M50 50 L78.28 21.72 A40 40 0 0 1 90.00 50.00 Z" fill="#f5c518" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/><path d="M50 50 L90.00 50.00 A40 40 0 0 1 78.28 78.28 Z" fill="#e5484d" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/><path d="M50 50 L78.28 78.28 A40 40 0 0 1 50.00 90.00 Z" fill="#2fbf71" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/><path d="M50 50 L50.00 90.00 A40 40 0 0 1 21.72 78.28 Z" fill="#8e5cf7" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/><path d="M50 50 L21.72 78.28 A40 40 0 0 1 10.00 50.00 Z" fill="#ff8a3d" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/><path d="M50 50 L10.00 50.00 A40 40 0 0 1 21.72 21.72 Z" fill="#22c3c3" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/><path d="M50 50 L21.72 21.72 A40 40 0 0 1 50.00 10.00 Z" fill="#ff5fa2" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
              <circle cx="50" cy="50" r="40" fill="none" stroke="#3a86ff" stroke-width="5"/>
              <circle cx="50" cy="50" r="44" fill="none" stroke="#f5c518" stroke-width="2"/>
              <circle cx="50" cy="50" r="7" fill="#f5c518" stroke="#ffffff" stroke-width="3"/>
            </g>
          </g>
          <path d="M50 14 L42 1 L58 1 Z" fill="#ffffff" stroke="#f5c518" stroke-width="3" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="wheel-label" id="wheel-label" role="button" tabindex="0">Randomized<br>choice</div>
    </div>

  </div>

  <button class="all-btn" id="all-btn" onclick="location.hash='all'">
    <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 6.2 L14 10 L8 13.8 Z" fill="currentColor"/></svg>
    view all movies
  </button>

  <header>
    <div class="brand">kavismovies.com</div>
    <div class="my-picks">my personal picks</div>
  </header>

  <main>
    <div class="card" id="quiz">
      <div class="progress-label"><span>Question <b id="num">1</b></span></div>
      <div class="bar"><div class="bar-fill" id="fill"></div></div>
      <h1 class="question quiz-q" id="q"></h1>
      <div class="buttons">
        <button class="btn btn-yes" onclick="answer('y')">Yes</button>
        <button class="btn btn-no" onclick="answer('n')">No</button>
      </div>
      <button class="back" id="back" onclick="goBack()" disabled>&larr; Previous question</button>
    </div>

    <div class="card vs-card" id="vs" hidden>
      <div class="progress-label"><span>Question <b id="vs-num">4</b></span></div>
      <div class="bar"><div class="bar-fill" id="vs-fill"></div></div>
      <h1 class="vs-title">Which one are you more in the mood for?</h1>
      <div class="vs-row">
        <button class="vs-pick" id="vs-a"><div class="poster"></div><div class="pick-title"></div><div class="pick-year"></div></button>
        <div class="vs-word">vs.</div>
        <button class="vs-pick" id="vs-b"><div class="poster"></div><div class="pick-title"></div><div class="pick-year"></div></button>
      </div>
      <button class="back" onclick="goBack()">&larr; Previous question</button>
    </div>

    <div class="card wide" id="result" hidden>
      <div class="results-head">
        <h1>Your top 5 picks</h1>
        <p>Tap a poster to see what it's about and how it rates on IMDb.</p>
      </div>
      <div class="posters" id="posters"></div>
      <div class="actions">
        <button class="btn btn-ghost" onclick="goBack()">&larr; Change last answer</button>
        <button class="btn btn-start" onclick="restart()">Start over</button>
      </div>
    </div>

    <div class="card wide" id="detail" hidden>
      <div class="detail">
        <div class="poster" id="d-poster"></div>
        <div>
          <h1 id="d-title"></h1>
          <div class="meta"><span id="d-year"></span><span class="rating" id="d-rating"></span><span id="d-extra"></span></div>
          <p class="cast" id="d-cast"></p>
          <p class="plot" id="d-plot"></p>
          <div class="actions">
            <button class="btn btn-ghost" onclick="closeDetail()">&larr; Back to my picks</button>
            <a class="btn btn-start" id="d-link" href="#" target="_blank" rel="noopener" hidden>View on IMDb</a>
          </div>
        </div>
      </div>
    </div>
  </main>


  <section class="random-page" id="random-page" hidden>
    <div class="big-wheel-wrap">
      <svg class="wheel-pointer" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5 L10 0 L10 10 Z" fill="#d9d9d9"/></svg>
      <svg class="big-wheel" viewBox="0 0 100 100">
        <g id="big-spin" style="transform-origin:50px 50px"></g>
        <circle cx="50" cy="50" r="48" fill="none" stroke="rgba(255,255,255,.22)" stroke-width=".5"/>
        <g class="hub" id="hub" role="button" tabindex="0" aria-label="Spin the wheel">
          <circle cx="50" cy="50" r="10" fill="#e9e9e9" stroke="rgba(0,0,0,.35)" stroke-width=".6"/>
          <text class="click-here" x="50" y="50" text-anchor="middle" dominant-baseline="central">click here</text>
        </g>
      </svg>
    </div>
    <button class="back-home" onclick="location.hash=''">&larr; Back to the questions</button>

  </section>


  <section class="all-page" id="all-page" hidden>
    <div class="all-head">
      <h1>All movies <span id="all-count"></span></h1>
      <input class="all-search" id="all-search" type="search" placeholder="Search by title" autocomplete="off">
    </div>
    <div class="all-grid" id="all-grid"></div>
    <p class="all-empty" id="all-empty" hidden>No movies match that search.</p>
    <button class="back-home" onclick="location.hash=''">&larr; Back to the questions</button>
  </section>

  <div class="spin-result" id="spin-result" hidden>
      <div class="card wide spin-card">
        <div class="detail">
          <div class="poster" id="r-poster"></div>
          <div>
            <p class="landed" id="r-label">The wheel picked</p>
            <h1 id="r-title"></h1>
            <div class="meta"><span id="r-year"></span><span class="rating" id="r-rating"></span><span id="r-extra"></span></div>
            <p class="cast" id="r-cast"></p>
            <p class="plot" id="r-plot"></p>
            <div class="actions">
              <button class="btn btn-ghost" onclick="closeSpin()">Close</button>
              <button class="btn btn-start" id="r-again" onclick="closeSpin(); spinBig();">Spin again</button>
              <a class="btn btn-ghost" id="r-link" href="#" target="_blank" rel="noopener" hidden>View on IMDb</a>
            </div>
          </div>
        </div>
      </div>
    </div>

<script>
  const $ = id => document.getElementById(id);
  const cache = {};

  function split(m) {
    const x = m.match(/^(.*) \((\d{4})\)$/);
    return x ? { title: x[1], year: x[2] } : { title: m, year: "" };
  }

  // Movie info (poster, rating, plot) comes from /api/movie on the live site.
  function getInfo(m) {
    if (!cache[m]) {
      const { title, year } = split(m);
      cache[m] = fetch(`/api/movie?t=${encodeURIComponent(title)}&y=${year}`)
        .then(r => r.ok ? r.json() : null)
        .catch(() => null);
    }
    return cache[m];
  }

  function posterInto(el, m, withTitle) {
    const { title } = split(m);
    el.innerHTML = `<div class="ph"></div>`;
    if (withTitle || el.id === "d-poster" || el.id === "r-poster") el.querySelector(".ph").textContent = title;
    getInfo(m).then(info => {
      if (info && info.poster) {
        const img = new Image();
        img.alt = `${title} poster`;
        img.onload = () => el.appendChild(img);
        img.src = info.poster;
      }
    });
  }

  function show(id) {
    ["quiz", "vs", "result", "detail"].forEach(k => $(k).hidden = k !== id);
    window.scrollTo(0, 0);
  }

  // ---------- Randomized quiz ----------
  const MOVIES = window.MOVIES.map(x => ({ m: x.m, t: new Set(x.t) }));
  const QUESTIONS = window.QUESTIONS;
  const sim = (a, b) => { let n = 0; a.t.forEach(x => { if (b.t.has(x)) n++; }); return n / (a.t.size + b.t.size - n); };
  const VS_AT = 3;          // the this-or-that round comes after this many questions
  let history = [];         // previous states, for the back button
  let state = null;

  function freshState() {
    return { cands: MOVIES.slice(), asked: new Set(), answers: [], picks: [], step: 0, vsDone: false, current: null };
  }

  function tierCap(depth) { return depth < 2 ? 1 : depth < 5 ? 2 : depth < 7 ? 3 : 4; }

  // Pick a question that splits the remaining movies well, with some randomness
  function chooseQuestion(st) {
    const n = st.cands.length;
    let cap = tierCap(st.answers.length), options = [];
    while (!options.length && cap <= 4) {
      for (const tag in QUESTIONS) {
        if (QUESTIONS[tag][0] > cap || st.asked.has(tag)) continue;
        let y = 0; st.cands.forEach(c => { if (c.t.has(tag)) y++; });
        if (!y || y === n) continue;
        options.push({ tag, bal: Math.min(y, n - y) / n });
      }
      cap++;
    }
    if (!options.length) return null;
    const best = Math.max(...options.map(o => o.bal));
    // early questions get more variety; later ones focus on splitting well
    const good = options.filter(o => o.bal >= best * (st.answers.length < 2 ? 0.3 : 0.5));
    return good[Math.floor(Math.random() * good.length)].tag;
  }

  // Pick two quite different movies that split the remaining ones evenly
  function choosePair(st) {
    const c = st.cands, n = c.length;
    const tries = [];
    for (let k = 0; k < 400; k++) {
      const a = c[Math.floor(Math.random() * n)], b = c[Math.floor(Math.random() * n)];
      if (a === b) continue;
      let sa = 0, sb = 0;
      c.forEach(x => { const d = sim(x, a) - sim(x, b); if (d > 0) sa++; else if (d < 0) sb++; else { sa++; sb++; } });
      if (sa === n || sb === n) continue;
      tries.push({ a, b, score: Math.min(sa, sb) / n + (1 - sim(a, b)) * 0.4 });
    }
    if (!tries.length) return null;
    tries.sort((x, y) => y.score - x.score);
    return tries[Math.floor(Math.random() * Math.min(5, tries.length))];
  }

  function estimateLeft(st) {
    return Math.max(1, Math.ceil(Math.log2(Math.max(st.cands.length, 5) / 5))) + (st.vsDone ? 0 : 1);
  }

  // Fill the results up to 5 with the movies that best match the answers
  function topFive(st) {
    const picked = st.cands.slice(0, 5);
    if (picked.length >= 5) return picked.map(c => c.m);
    const score = mv => {
      let s = 0;
      st.answers.forEach(a => { if (mv.t.has(a.tag) === a.yes) s += 1; });
      st.picks.forEach(p => { s += 2 * (sim(mv, p.win) - sim(mv, p.lose)); });
      return s;
    };
    const rest = MOVIES.filter(mv => !picked.includes(mv)).sort((a, b) => score(b) - score(a));
    return picked.concat(rest.slice(0, 5 - picked.length)).map(c => c.m);
  }

  function next() {
    const st = state;
    // The this-or-that round always happens once, around the middle
    if (!st.vsDone && st.cands.length >= 4 && (st.answers.length >= VS_AT || st.cands.length <= 12)) {
      const pair = choosePair(st);
      if (pair) { st.current = { kind: "vs", a: pair.a, b: pair.b }; return render(); }
      st.vsDone = true;
    }
    if (st.cands.length <= 5) { st.current = { kind: "done" }; return render(); }
    const tag = chooseQuestion(st);
    if (!tag) { st.current = { kind: "done" }; return render(); }
    st.current = { kind: "q", tag };
    render();
  }

  function snapshot(st) {
    return { cands: st.cands.slice(), asked: new Set(st.asked), answers: st.answers.slice(), picks: st.picks.slice(), step: st.step, vsDone: st.vsDone, current: st.current };
  }

  function answer(a) {
    const st = state, tag = st.current.tag, yes = a === "y";
    history.push(snapshot(st));
    st.asked.add(tag);
    st.answers.push({ tag, yes });
    st.cands = st.cands.filter(c => c.t.has(tag) === yes);
    st.step++;
    next();
  }

  function choose(side) {
    const st = state, win = side === "a" ? st.current.a : st.current.b, lose = side === "a" ? st.current.b : st.current.a;
    history.push(snapshot(st));
    st.picks.push({ win, lose });
    st.cands = st.cands.filter(c => c === win || (c !== lose && sim(c, win) >= sim(c, lose)));
    st.vsDone = true;
    st.step++;
    next();
  }
  $("vs-a").onclick = () => choose("a");
  $("vs-b").onclick = () => choose("b");

  function goBack() { if (history.length) { state = history.pop(); render(); } }
  function restart() { history = []; state = freshState(); next(); }

  function setProgress(numId, fillId) {
    const done = state.step, pct = Math.round(done / (done + estimateLeft(state)) * 100);
    $(numId).textContent = done + 1;
    $(fillId).style.width = Math.max(pct, 3) + "%";
  }

  function render() {
    const cur = state.current;
    if (cur.kind === "done") {
      const box = $("posters");
      box.innerHTML = "";
      topFive(state).forEach(m => {
        const { title, year } = split(m);
        const b = document.createElement("button");
        b.className = "pick";
        b.innerHTML = `<div class="poster"></div><div class="pick-title"></div><div class="pick-year"></div>`;
        b.querySelector(".pick-title").textContent = title;
        b.querySelector(".pick-year").textContent = year;
        posterInto(b.querySelector(".poster"), m);
        b.onclick = () => openDetail(m);
        box.appendChild(b);
      });
      show("result");
      return;
    }
    if (cur.kind === "vs") {
      show("vs");
      setProgress("vs-num", "vs-fill");
      [["vs-a", cur.a], ["vs-b", cur.b]].forEach(([id, mv]) => {
        const el = $(id), { title, year } = split(mv.m);
        posterInto(el.querySelector(".poster"), mv.m, true);
        el.querySelector(".pick-title").textContent = title;
        el.querySelector(".pick-year").textContent = year;
      });
      return;
    }
    show("quiz");
    const q = $("q");
    q.style.opacity = 0;
    setTimeout(() => { q.textContent = QUESTIONS[cur.tag][1]; q.style.opacity = 1; }, 150);
    setProgress("num", "fill");
    $("back").disabled = history.length === 0;
  }

  function openDetail(m) {
    const { title, year } = split(m);
    $("d-title").textContent = title;
    $("d-year").textContent = year;
    $("d-rating").innerHTML = "";
    $("d-extra").textContent = "";
    $("d-plot").textContent = "Loading details...";
    $("d-cast").textContent = "";
    $("d-link").hidden = true;
    posterInto($("d-poster"), m);
    show("detail");
    getInfo(m).then(info => {
      if (!info) {
        $("d-plot").textContent = "Details for this movie couldn't be loaded right now. Try again in a moment.";
        return;
      }
      if (info.rating) {
        $("d-rating").innerHTML = `<span class="imdb">IMDb</span><span></span>`;
        $("d-rating").lastChild.textContent = `${info.rating} / 10`;
      }
      $("d-extra").textContent = [info.runtime, info.genre].filter(Boolean).join("  ·  ");
      if (info.actors) { $("d-cast").innerHTML = "<b>Starring</b> "; $("d-cast").append(info.actors); }
      $("d-plot").textContent = info.plot || "";
      if (info.imdbID) {
        $("d-link").href = `https://www.imdb.com/title/${info.imdbID}/`;
        $("d-link").hidden = false;
      }
    });
  }

  function closeDetail() { show("result"); }
  let wheelTitles = [];
  // Fill the big wheel with every movie title, in alternating colors
  (function buildWheel() {
    const titles = window.MOVIES.map(x => x.m);
    titles.sort((a, b) => a.localeCompare(b));
    wheelTitles = titles;
    const colors = ["#a3222b", "#2656b0", "#1a7d44", "#b8840f"];
    const N = titles.length, R = 48, step = 360 / N;
    const ns = "http://www.w3.org/2000/svg";
    const g = $("big-spin");
    const rad = d => d * Math.PI / 180;
    titles.forEach((m, i) => {
      const a1 = rad(i * step), a2 = rad((i + 1) * step);
      const p = document.createElementNS(ns, "path");
      p.setAttribute("d", `M50 50 L${50 + R * Math.cos(a1)} ${50 + R * Math.sin(a1)} A${R} ${R} 0 0 1 ${50 + R * Math.cos(a2)} ${50 + R * Math.sin(a2)} Z`);
      p.setAttribute("fill", colors[i % colors.length]);
      g.appendChild(p);
      const t = document.createElementNS(ns, "text");
      t.setAttribute("transform", `translate(50 50) rotate(${(i + 0.5) * step})`);
      t.setAttribute("x", "46.6");
      t.setAttribute("y", "0");
      t.setAttribute("text-anchor", "end");
      t.setAttribute("dominant-baseline", "central");
      t.setAttribute("font-size", "0.62");
      t.textContent = split(m).title;
      g.appendChild(t);
    });
  })();

  // Wheel button opens the Random page
  $("wheel").addEventListener("click", () => { location.hash = "random"; });
  $("wheel-label").addEventListener("click", () => { location.hash = "random"; });
  $("wheel-label").addEventListener("keydown", e => { if (e.key === "Enter") location.hash = "random"; });

  // Big wheel: click the center to wind up, spin for about 4 seconds, and land on a movie
  let bigAngle = 0, spinning = false;
  function spinBig() {
    if (spinning) return;
    spinning = true;
    const wrap = $("random-page"); wrap.classList.add("spinning");
    const g = $("big-spin");
    const N = wheelTitles.length, step = 360 / N;
    const pick = Math.floor(Math.random() * N);
    const jitter = (Math.random() - 0.5) * step * 0.6;
    // Pointer sits at 0deg (right side). Slice "pick" centers there when rotation = -(pick + .5) * step
    let target = -((pick + 0.5) * step) + jitter;
    const start = bigAngle, wind = start - 50;
    let end = target;
    while (end < start + 360 * 5) end += 360;
    const anim = g.animate([
      { transform: `rotate(${start}deg)`, offset: 0, easing: "cubic-bezier(.45,0,.55,1)" },
      { transform: `rotate(${wind}deg)`, offset: 0.18, easing: "cubic-bezier(.45,0,.1,1)" },
      { transform: `rotate(${end}deg)`, offset: 1 }
    ], { duration: 4000, fill: "forwards" });
    anim.onfinish = () => {
      bigAngle = end % 360;
      g.style.transform = `rotate(${bigAngle}deg)`;
      anim.cancel();
      spinning = false;
      wrap.classList.remove("spinning");
      setTimeout(() => showSpinResult(wheelTitles[pick]), 350);
    };
  }
  $("hub").addEventListener("click", spinBig);
  $("hub").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); spinBig(); } });

  function showSpinResult(m, fromWheel = true) {
    const { title, year } = split(m);
    $("r-label").textContent = fromWheel ? "The wheel picked" : "";
    $("r-label").hidden = !fromWheel;
    $("r-again").hidden = !fromWheel;
    $("r-title").textContent = title;
    $("r-year").textContent = year;
    $("r-rating").innerHTML = "";
    $("r-extra").textContent = "";
    $("r-cast").textContent = "";
    $("r-plot").textContent = "Loading details...";
    $("r-link").hidden = true;
    posterInto($("r-poster"), m);
    $("spin-result").hidden = false;
    getInfo(m).then(info => {
      if (!info) {
        $("r-plot").textContent = "Details for this movie couldn't be loaded right now. Try again in a moment.";
        return;
      }
      if (info.rating) {
        $("r-rating").innerHTML = `<span class="imdb">IMDb</span><span></span>`;
        $("r-rating").lastChild.textContent = `${info.rating} / 10`;
      }
      $("r-extra").textContent = [info.runtime, info.genre].filter(Boolean).join("  ·  ");
      if (info.actors) { $("r-cast").innerHTML = "<b>Starring</b> "; $("r-cast").append(info.actors); }
      $("r-plot").textContent = info.plot || "";
      if (info.imdbID) { $("r-link").href = `https://www.imdb.com/title/${info.imdbID}/`; $("r-link").hidden = false; }
    });
  }
  function closeSpin() { $("spin-result").hidden = true; }
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSpin(); });

  // All movies page: poster grid that loads posters as you scroll
  let allBuilt = false;
  const lazy = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      lazy.unobserve(e.target);
      posterInto(e.target, e.target.dataset.m);
    });
  }, { rootMargin: "400px" });
  function buildAll() {
    if (allBuilt) return;
    allBuilt = true;
    const grid = $("all-grid");
    $("all-count").textContent = `(${wheelTitles.length})`;
    wheelTitles.forEach(m => {
      const { title, year } = split(m);
      const b = document.createElement("button");
      b.className = "pick";
      b.dataset.search = title.toLowerCase();
      b.innerHTML = `<div class="poster"><div class="ph"></div></div><div class="pick-title"></div><div class="pick-year"></div>`;
      b.querySelector(".pick-title").textContent = title;
      b.querySelector(".pick-year").textContent = year;
      b.querySelector(".poster").dataset.m = m;
      b.onclick = () => showSpinResult(m, false);
      grid.appendChild(b);
      lazy.observe(b.querySelector(".poster"));
    });
  }
  $("all-search").addEventListener("input", e => {
    const q = e.target.value.trim().toLowerCase();
    let shown = 0;
    $("all-grid").querySelectorAll(".pick").forEach(b => {
      const hit = !q || b.dataset.search.includes(q);
      b.hidden = !hit; if (hit) shown++;
    });
    $("all-empty").hidden = shown > 0;
  });

  function route() {
    const onRandom = location.hash === "#random";
    const onAll = location.hash === "#all";
    document.body.classList.toggle("on-random", onRandom);
    document.body.classList.toggle("on-all", onAll);
    $("random-page").hidden = !onRandom;
    $("all-page").hidden = !onAll;
    if (onAll) buildAll();
    closeSpin();
  }
  window.addEventListener("hashchange", route);
  route();
  restart();
</script>
</body>
</html>
